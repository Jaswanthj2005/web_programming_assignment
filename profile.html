<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
    <title>User Profile</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="profile.css" />
</head>
<body>
    <!-- Main card container (Relative Positioning) -->
    <div id="profile-container" class="card">
        
        <!-- Badge (Absolute Positioning) -->
        <span class="badge">Pro Member</span>
        
        <div class="image-wrapper">
            <!-- Replace src with your own image paths -->
            <img src="profile_photo.jpg" alt="User Profile Picture" class="profile-img" />
            <!-- Decorative Icon (Absolute Positioning) -->
            <img src="jj2.png" alt="Star Icon" class="deco-icon" />
        </div>

        <h1 class="user-name">Jaswanth J</h1>
        <p class="bio">AI, ML enthusiast with passion to build models that benefit society.</p>
        
        <button class="contact-btn">Contact Me</button>
    </div>
</body>
</html>
